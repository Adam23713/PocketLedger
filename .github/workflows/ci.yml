name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres-cache-tests:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cache-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey-cache-tests:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PL_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=cache-test-password
      PL_TEST_VALKEY: localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PocketLedger.slnx

      - name: Build
        run: dotnet build PocketLedger.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PocketLedger.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  docker-build-and-smoketest:
    name: Docker build & startup smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI .env file
        run: |
          SIGNING_KEY=$(openssl rand -base64 64 | tr -d '\n')
          cat > .env <<EOF
          POCKETLEDGER_LANDING_DOMAIN=ledger.ci.local
          POCKETLEDGER_WEB_DOMAIN=app.ledger.ci.local
          POCKETLEDGER_API_DOMAIN=api.ledger.ci.local
          POCKETLEDGER_IDENTITY_DOMAIN=identity.ledger.ci.local
          POCKETLEDGER_WEB_CLIENT_SECRET=ci-client-secret-not-for-production
          POCKETLEDGER_SIGNING_KEY=${SIGNING_KEY}
          CROWDSEC_API_KEY=ci-only-not-for-production
          POSTGRES_USER=pocketledger
          POSTGRES_PASSWORD=ci-postgres-password
          POCKETLEDGER_INITIAL_USERNAME=ci-admin
          POCKETLEDGER_INITIAL_PASSWORD=Ci-Admin-Password-123!
          EOF

      - name: Build images (web, api, identity, landing)
        run: docker compose build web api identity landing

      - name: Start stack (without Caddy, no real domains/TLS in CI)
        run: docker compose up -d valkey web api identity landing

      - name: Wait for services to actually start
        run: |
          set -e
          SERVICES="web-database api-database identity-database web api identity landing"
          TIMEOUT=120
          ELAPSED=0

          echo "Waiting for database healthchecks..."
          for DB in web-database api-database identity-database; do
            until [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q $DB)" 2>/dev/null)" = "healthy" ]; do
              ELAPSED=$((ELAPSED+2))
              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "::error::$DB did not become healthy in time"
                docker compose logs "$DB"
                exit 1
              fi
              sleep 2
            done
            echo "$DB is healthy"
          done

          echo "Waiting for app hosts to report they are listening..."
          for APP in web api identity landing; do
            ELAPSED=0
            until docker compose logs "$APP" 2>&1 | grep -q "Now listening on"; do
              # Fail fast if the container already exited
              STATE="$(docker inspect -f '{{.State.Status}}' "$(docker compose ps -q $APP)" 2>/dev/null || echo missing)"
              if [ "$STATE" = "exited" ] || [ "$STATE" = "missing" ]; then
                echo "::error::$APP container exited unexpectedly"
                docker compose logs "$APP"
                exit 1
              fi
              ELAPSED=$((ELAPSED+2))
              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "::error::$APP did not start listening in time"
                docker compose logs "$APP"
                exit 1
              fi
              sleep 2
            done
            echo "$APP is listening"
          done

          echo "Checking no container has crashed/restarted..."
          for SVC in $SERVICES; do
            STATE="$(docker inspect -f '{{.State.Status}}' "$(docker compose ps -q $SVC)")"
            RESTARTS="$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q $SVC)")"
            echo "$SVC: state=$STATE restarts=$RESTARTS"
            if [ "$STATE" != "running" ]; then
              echo "::error::$SVC is not running (state=$STATE)"
              docker compose logs "$SVC"
              exit 1
            fi
          done

      - name: Dump logs (always, for debugging)
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  edge-security:
    name: Caddy and CrowdSec verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build custom Caddy
        run: docker compose -p pocketledger --env-file .env.example build caddy
      - name: Verify isolated edge protection
        run: python3 tools/verify-edge-security.py
